<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">流動幻彩</title>
  <desc id="desc">無意識去識別化工作站的幻彩菱形品牌符號</desc>
  <defs>
    <linearGradient id="prism" x1="4" y1="7" x2="60" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5d58b"/>
      <stop offset=".3" stop-color="#a8eee3"/>
      <stop offset=".58" stop-color="#b9a9ff"/>
      <stop offset=".8" stop-color="#f4a9c3"/>
      <stop offset="1" stop-color="#f5d58b"/>
    </linearGradient>
    <radialGradient id="field" cx="32" cy="20" r="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b4d40"/>
      <stop offset="1" stop-color="#16271f"/>
    </radialGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="#20332b"/>
  <polygon points="32,4 60,32 32,60 4,32" fill="url(#field)" stroke="url(#prism)" stroke-width="2.6" filter="url(#soft-glow)"/>
  <polygon points="32,12 52,32 32,52 12,32" fill="none" stroke="url(#prism)" stroke-opacity=".64" stroke-width="1"/>
  <path d="M20 32c3.9-6 7.9-9 12-9s8.1 3 12 9c-3.9 6-7.9 9-12 9s-8.1-3-12-9Z" fill="#20332b" stroke="url(#prism)" stroke-width="1.35"/>
  <circle cx="32" cy="32" r="4.7" fill="url(#prism)"/>
  <circle cx="30.5" cy="30.4" r="1.3" fill="#fff8e9" opacity=".88"/>
</svg>
